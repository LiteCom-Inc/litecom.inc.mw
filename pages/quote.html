<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Request a Quote | Litecom Technologies</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    :root {
      --primary-blue: #0d6efd;
      --army-green: #4b6f44;
    }

    body {
      background-color: #f8f9fa;
      font-family: "Segoe UI", Tahoma, sans-serif;
    }

    .quote-header {
      background-color: var(--primary-blue);
      color: white;
      padding: 70px 0;
    }

    .quote-card {
      background: white;
      border-radius: 8px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .form-label {
      font-weight: 600;
    }

    .note {
      font-size: 0.9rem;
      color: #6c757d;
    }

    footer {
      background-color: #0b5ed7;
      color: white;
    }
  </style>
</head>
<body>

<!-- ===== HEADER ===== -->
<section class="quote-header text-center">
  <div class="container">
    <h1 class="fw-bold">Request a Quote</h1>
    <p class="lead mt-2">
      Tell us about your project and we’ll get back to you shortly.
    </p>
  </div>
</section>

<!-- ===== FORM SECTION ===== -->
<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">

        <div class="quote-card">

          <!-- FORM -->
          <form id="quoteForm">

            <div class="row g-3">

              <div class="col-md-6">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control" required>
              </div>

              <div class="col-md-6">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" required>
              </div>

              <div class="col-md-6">
                <label class="form-label">Phone Number</label>
                <input type="tel" name="phone" class="form-control" required>
              </div>

              <div class="col-md-6">
                <label class="form-label">Service Required</label>
                <select name="service" class="form-select" required>
                  <option value="">Select a service</option>
                  <option>Web Development</option>
                  <option>Mobile App Development</option>
                  <option>Networking & CCTV Installation</option>
                  <option>Electronics & IoT Solutions</option>
                  <option>ICT Supplies & Accessories</option>
                  <option>Other</option>
                </select>
              </div>

              <div class="col-12">
                <label class="form-label">Project Description</label>
                <textarea
                  name="message"
                  rows="4"
                  class="form-control"
                  placeholder="Briefly describe what you need..."
                  required
                ></textarea>
              </div>

              <div class="col-md-6">
                <label class="form-label">Estimated Budget (Optional)</label>
                <select name="budget" class="form-select">
                  <option value="">Select range</option>
                  <option>Below MWK 200,000</option>
                  <option>MWK 200,000 – 500,000</option>
                  <option>MWK 500,000 – 1,000,000</option>
                  <option>Above MWK 1,000,000</option>
                </select>
              </div>

              <div class="col-md-6">
                <label class="form-label">Preferred Contact Method</label>
                <select name="contact_method" class="form-select">
                  <option>Email</option>
                  <option>Phone Call</option>
                  <option>WhatsApp</option>
                </select>
              </div>

              <div class="col-12">
                <p class="note">
                  We respect your privacy. Your information will only be used to respond to your request.
                </p>
              </div>

              <div class="col-12 text-center">
                <button type="submit" class="btn btn-success btn-lg px-5">
                  Submit Quote Request
                </button>
              </div>

            </div>
          </form>

        </div>

      </div>
    </div>
  </div>
</section>

<!-- ===== FOOTER ===== -->
<footer class="py-3 text-center">
  <div class="container">
    <small>© Litecom Technologies. All Rights Reserved.</small>
  </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/quoteSubmission.js"></script>
</body>
</html>
